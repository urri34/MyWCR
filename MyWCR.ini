# MyWCR configuració
MYWCR_BASE=/home/user/MyWCR

# --- RTSP (servidor MediaMTX + ruta) ---
# Port RTSP on escolta el servidor (binding). Exemple: 8554
MYWCR_RTSP_PORT=8554

# Ruta/nom del stream dins del servidor (sense la barra inicial). Exemple: mywcr
MYWCR_RTSP_PATH=stream1

# Host que faran servir els VISORS per connectar-s'hi (IP/hostname públic o LAN).
# No afecta el bind del servidor, només és per construir URL útils.
MYWCR_RTSP_HOST=127.0.0.1

# Credencials per als VISORS remots (lectura / playback) via authInternalUsers
MYWCR_RTSP_USERNAME=admin
MYWCR_RTSP_PASSWORD=password

# Host per publicar (FFMPEG -> MediaMTX). Normalment localhost.
MYWCR_RTSP_PUB_HOST=127.0.0.1

# URLs derivades (pots deixar-les tal qual, el supervisor les expandirà)
# URL on FFMPEG publica (sense credencials, permès només des de localhost)
MYWCR_RTSP_PUBLISH_URL=rtsp://${MYWCR_RTSP_PUB_HOST}:${MYWCR_RTSP_PORT}/${MYWCR_RTSP_PATH}

# URL per veure el stream (amb credencials)
MYWCR_RTSP_READ_URL=rtsp://${MYWCR_RTSP_USERNAME}:${MYWCR_RTSP_PASSWORD}@${MYWCR_RTSP_HOST}:${MYWCR_RTSP_PORT}/${MYWCR_RTSP_PATH}

# (Compatibilitat) Si defineixes MYWCR_RTSP_URL, s'usarà com a destí de publicació.
# MYWCR_RTSP_URL=rtsp://127.0.0.1:8554/mywcr

# --- MediaMTX (mediamtx.yml) ---
# Nivell de log: error | warn | info | debug
MEDIAMTX_LOG_LEVEL=debug

# --- Video ---
MYWCR_CAMERA_DEVICE=/dev/video0
MYWCR_FPS=30
MYWCR_SIZE=1920x1080
MYWCR_VBITRATE=4M
MYWCR_GOP=100

# --- Binaris (buit = autodetecta) ---
MEDIAMTX_BIN={$MYWCR_BASE}/mediamtx
FFMPEG_BIN=/usr/bin/ffmpeg
